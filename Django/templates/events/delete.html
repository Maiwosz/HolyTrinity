{% extends "base.html" %}

{% block content %}
<p>Are you sure you want to delete "{{ event.title }}"?</p>
<form action="{% url 'events:delete' event.id %}" method="post">
    {% csrf_token %}
    <input type="submit" value="DELETE">
</form>
<a href="{% url 'events:get' event.id %}">Cancel</a>
{% endblock %}
